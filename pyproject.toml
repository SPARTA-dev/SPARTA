[build-system]
requires = ["setuptools>=77"]  # SPDX `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"

[project]
# Note: "sparta" on PyPI is an unrelated RDF library -- install SPARTA from this
# repository (see README), never with a bare `pip install sparta`.
name = "SPARTA"
dynamic = ["version"]   # sparta.__version__
description = "SPARTA - SPectroscopic vARiabiliTy Analysis"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sahar Shahaf", email = "sahar.shahaf@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# specutils 2.x itself requires Python >= 3.10 and astropy >= 6.0.
dependencies = [
    "sparta-unicor>=0.2",   # packages/unicor in this repo
    "sparta-todcor>=0.2",   # packages/todcor in this repo
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=6.0",
    "specutils>=2.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
# nbclient + ipykernel run the example notebooks (tests/test_notebooks.py, -m slow).
test = ["pytest", "nbclient", "ipykernel"]
# Optional progress bars (Observations methods take progress=True).
progress = ["tqdm"]

[project.urls]
Source = "https://github.com/SPARTA-dev/SPARTA"
"USuRPER paper" = "https://ui.adsabs.harvard.edu/abs/2020A%26A...642A.146B/abstract"

[tool.setuptools.dynamic]
version = { attr = "sparta.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The bundled PHOENIX templates the examples and tests use, so a regular
# (non-editable) install finds them instead of downloading into site-packages.
"sparta" = ["template_files/WAVE_PHOENIX-ACES-AGSS-COND-2011.fits",
            "template_files/lte*.fits"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/unicor/tests", "packages/todcor/tests"]
# Always test this checkout, whatever happens to be installed in the env.
pythonpath = ["src", "packages/unicor/src", "packages/todcor/src"]
markers = ["slow: executes the example notebooks; deselected by default, run with -m slow"]
addopts = "-m 'not slow'"
